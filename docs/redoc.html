<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPM Academy — API Docs (Redoc)</title>
  <meta name="description" content="Redoc publication view for KPM Academy API.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --kpm-topbar-h: 60px;
      --kpm-bg: #0f172a;
      --kpm-surface: #1e293b;
      --kpm-border: #334155;
      --kpm-text: #e2e8f0;
      --kpm-muted: #94a3b8;
      --kpm-primary: #60a5fa;
      --kpm-primary-glow: rgba(96, 165, 250, 0.3);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding-top: var(--kpm-topbar-h);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--kpm-bg);
      color: var(--kpm-text);
      -webkit-font-smoothing: antialiased;
    }

    /* Page loader */
    .kpm-page-loader {
      position: fixed; inset: 0; background: var(--kpm-bg);
      z-index: 9999999; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .kpm-page-loader.kpm-loaded { opacity: 0; visibility: hidden; pointer-events: none; }
    .kpm-loader-pulse {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
      animation: kpmPulse 1s ease-in-out infinite;
    }
    @keyframes kpmPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.85);opacity:.6} }

    /* Topbar */
    .kpm-topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--kpm-topbar-h);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid transparent;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; z-index: 999999;
      transition: all 0.3s ease;
    }
    .kpm-topbar.kpm-scrolled {
      background: rgba(15, 23, 42, 0.95);
      border-bottom-color: var(--kpm-border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }
    .kpm-brand-link {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--kpm-text);
    }
    .kpm-logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 17px; box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      animation: kpmFloat 3s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes kpmFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    .kpm-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .kpm-title { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .kpm-subtitle { font-size: 11px; color: var(--kpm-muted); font-weight: 500; }

    /* Nav */
    .kpm-nav { display: flex; align-items: center; gap: 4px; }
    .kpm-nav-btn {
      display: flex; align-items: center; gap: 7px; text-decoration: none;
      font-size: 13px; font-weight: 500; color: var(--kpm-muted);
      padding: 7px 14px; border-radius: 8px; transition: all 0.2s; white-space: nowrap;
    }
    .kpm-nav-btn:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .kpm-nav-btn.active {
      color: #fff; background: var(--kpm-primary);
      font-weight: 600; box-shadow: 0 2px 12px var(--kpm-primary-glow);
    }
    .kpm-sep { width: 1px; height: 20px; background: var(--kpm-border); margin: 0 8px; }
    .kpm-specs { display: flex; align-items: center; gap: 6px; }
    .kpm-spec-link {
      font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600;
      color: #94a3b8; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1); padding: 5px 10px;
      border-radius: 6px; text-decoration: none; transition: all 0.2s;
    }
    .kpm-spec-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Hamburger */
    .kpm-hamburger {
      display: none; background: none; border: none; cursor: pointer;
      padding: 8px; border-radius: 8px; transition: background 0.2s;
    }
    .kpm-hamburger:hover { background: rgba(255,255,255,0.07); }

    /* Mobile drawer */
    .kpm-mobile-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px); z-index: 999998;
      opacity: 0; visibility: hidden; transition: all 0.3s;
    }
    .kpm-mobile-overlay.kpm-open { opacity: 1; visibility: visible; }
    .kpm-mobile-drawer {
      position: fixed; top: 0; right: 0; width: 300px; max-width: 85vw;
      height: 100vh; background: var(--kpm-surface);
      border-left: 1px solid var(--kpm-border); z-index: 999999;
      padding: 80px 24px 32px; transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }
    .kpm-mobile-drawer.kpm-open { transform: translateX(0); }
    .kpm-mobile-drawer-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: none; color: var(--kpm-muted);
      cursor: pointer; padding: 6px; border-radius: 6px; transition: all 0.2s;
    }
    .kpm-mobile-drawer-close:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .kpm-mobile-nav { display: flex; flex-direction: column; gap: 4px; }
    .kpm-mobile-nav a {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
      font-size: 14px; font-weight: 500; color: var(--kpm-muted);
      padding: 12px 14px; border-radius: 10px; transition: all 0.2s;
    }
    .kpm-mobile-nav a:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .kpm-mobile-nav a.active { color: #fff; background: var(--kpm-primary); }
    .kpm-mobile-specs {
      margin-top: 20px; padding-top: 20px;
      border-top: 1px solid var(--kpm-border); display: flex; gap: 8px;
    }
    .kpm-mobile-specs a {
      flex: 1; text-align: center; font-family: "JetBrains Mono", monospace;
      font-size: 12px; font-weight: 600; color: var(--kpm-muted);
      text-decoration: none; padding: 10px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--kpm-border);
      transition: all 0.2s;
    }
    .kpm-mobile-specs a:hover { color: #fff; border-color: var(--kpm-primary); }

    @media (max-width: 900px) {
      .kpm-nav, .kpm-sep, .kpm-specs { display: none !important; }
      .kpm-hamburger { display: flex; align-items: center; justify-content: center; }
      .kpm-topbar { padding: 0 16px; }
    }
    @media (max-width: 480px) {
      .kpm-brand-text .kpm-subtitle { display: none; }
    }

    /* Global scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--kpm-bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>

      </a>
      <a href="/docs/swagger" class="kpm-nav-btn">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Swagger
      </a>
      <a href="/docs/redoc" class="kpm-nav-btn active">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        Redoc
      </a>
      <div class="kpm-sep"></div>
      <div class="kpm-specs">
        <a href="/docs/swagger.yaml" target="_blank" class="kpm-spec-link">YAML</a>
        <a href="/docs/openapi.json" target="_blank" class="kpm-spec-link">JSON</a>
      </div>
    </nav>
    <button class="kpm-hamburger" id="kpmHamburger" aria-label="Open menu">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <div class="kpm-mobile-overlay" id="kpmOverlay"></div>
  <div class="kpm-mobile-drawer" id="kpmDrawer">
    <button class="kpm-mobile-drawer-close" id="kpmDrawerClose" aria-label="Close menu">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <nav class="kpm-mobile-nav">
      <a href="/docs">Overview</a>
      <a href="/docs/scalar">Reference (Scalar)</a>
      <a href="/docs/swagger">Swagger UI</a>
      <a href="/docs/redoc" class="active">Redoc</a>

      <a href="/docs/openapi.json" target="_blank">JSON</a>

  <redoc id="redoc-container"
    spec-url="/docs/openapi.json"
    expand-responses="200,201"
    hide-download-button
    scroll-y-offset="64"
    theme='{"colors":{"primary":{"main":"#60a5fa","dark":"#3b82f6","light":"#93c5fd"},"success":{"main":"#34d399"},"warning":{"main":"#fbbf24"},"error":{"main":"#f87171"},"text":{"primary":"#e2e8f0","secondary":"#94a3b8","dark":"#0f172a"},"border":{"dark":"#334155","light":"#475569"},"bg":{"main":"#0f172a","alternative":"#1e293b","code":"#1e293b"},"http":{"get":"#60a5fa","post":"#34d399","put":"#fbbf24","patch":"#c084fc","delete":"#f87171"},"responses":{"success":{"backgroundColor":"#0f172a","color":"#34d399"},"error":{"backgroundColor":"#0f172a","color":"#f87171"},"info":{"backgroundColor":"#0f172a","color":"#60a5fa"},"redirect":{"backgroundColor":"#0f172a","color":"#fbbf24"},"pending":{"backgroundColor":"#0f172a","color":"#94a3b8"},"internal":{"backgroundColor":"#0f172a","color":"#f87171"}}},"typography":{"fontFamily":"Inter, -apple-system, BlinkMacSystemFont, sans-serif","fontSize":"15px","smFontSize":"13px","codeFontFamily":"JetBrains Mono, Consolas, monospace","headings":{"fontFamily":"Inter, -apple-system, BlinkMacSystemFont, sans-serif","color":"#f1f5f9","fontWeights":{"bold":"700"}},"links":{"color":"#60a5fa","visited":"#818cf8","hover":"#93c5fd"},"monospaceFacts":{"fontFamily":"JetBrains Mono, Consolas, monospace","fontSize":"13px"},"code":{"fontFamily":"JetBrains Mono, Consolas, monospace","fontSize":"13px","backgroundColor":"#1e293b","color":"#f1f5f9"}},"sidebar":{"backgroundColor":"#0f172a","textColor":"#94a3b8","activeTextColor":"#60a5fa","activeBg":"rgba(96,165,250,0.08)","width":"280px","fontSize":"13px","menuItemHoverColor":"rgba(255,255,255,0.04)","level1ItemsColor":"#e2e8f0"},"rightPanel":{"backgroundColor":"#0f172a","width":"0px","textColor":"#e2e8f0"},"fab":{"backgroundColor":"#3b82f6"},"schema":{"nestedObjectBackgroundColor":"transparent","typeNameColor":"#60a5fa","typeTitleColor":"#f1f5f9"},"table":{"headerBackgroundColor":"#1e293b","headerTextColor":"#e2e8f0","rowBackgroundColor":"transparent","stripRowBackgroundColor":"rgba(255,255,255,0.02)","borderColor":"#334155"},"heading":{"marginSpacing":"20px"},"labels":{"letterSpacing":"0.5px"}}'
  ></redoc>

  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  <script>
    /*
     * Dark mode for Redoc: inject CSS into shadow DOM + fix inline styles.
     */
    (function () {
      var BG = '#0f172a';
      var SURF = '#1e293b';
      var BORDER = '#334155';
      var TXT = '#e2e8f0';
      var MUTED = '#94a3b8';
      var HEAD = '#f1f5f9';
      var PRIM = '#60a5fa';
      var CODE_BG = '#020617';

      var OVERRIDES = [
        '* { color: ' + TXT + ' !important; }',
        'h1, h2, h3, h4, h5, h6, [class*="heading"] { color: ' + HEAD + ' !important; }',
        'p, li, td, th, span, label, div { color: inherit !important; }',
        'p { color: #cbd5e1 !important; line-height: 1.7 !important; margin-bottom: 12px !important; }',
        'a, a span { color: ' + PRIM + ' !important; }',
        'a:hover { color: #93c5fd !important; }',
        'table { background: ' + SURF + ' !important; border: 1px solid ' + BORDER + ' !important; border-radius: 8px !important; width: 100% !important; }',
        'thead { background: ' + SURF + ' !important; }',
        'th { background: ' + SURF + ' !important; color: ' + TXT + ' !important; border-bottom: 2px solid ' + BORDER + ' !important; padding: 12px 16px !important; font-size: 12px !important; text-transform: uppercase !important; letter-spacing: 0.05em !important; }',
        'td { border-bottom: 1px solid rgba(51,65,85,0.5) !important; color: #cbd5e1 !important; padding: 12px 16px !important; }',
        'tr:hover td { background: rgba(255,255,255,0.03) !important; }',
        'code { background: rgba(255,255,255,0.08) !important; padding: 2px 7px !important; border-radius: 4px !important; color: ' + HEAD + ' !important; font-size: 0.9em !important; font-family: "JetBrains Mono", monospace !important; }',
        'pre { background: ' + CODE_BG + ' !important; border: 1px solid ' + BORDER + ' !important; border-radius: 8px !important; padding: 16px !important; overflow-x: auto !important; }',
        'pre code { background: transparent !important; padding: 0 !important; color: ' + TXT + ' !important; }',
        'input[type="text"], input[type="search"] { background: rgba(255,255,255,0.06) !important; border: 1px solid ' + BORDER + ' !important; color: ' + TXT + ' !important; border-radius: 8px !important; padding: 8px 12px !important; }',
        'input:focus { border-color: ' + PRIM + ' !important; box-shadow: 0 0 0 3px rgba(96,165,250,0.25) !important; outline: none !important; }',
        'button.HTTP-status, [class*="http-status"] { font-family: "JetBrains Mono", monospace !important; }',
        '.property-type, .type-name, [class*="type"] { color: ' + PRIM + ' !important; font-family: "JetBrains Mono", monospace !important; }',
        '.required { color: #f87171 !important; font-weight: 600 !important; }',
        'select { background: ' + SURF + ' !important; border: 1px solid ' + BORDER + ' !important; color: ' + TXT + ' !important; border-radius: 6px !important; }',
        '[class*="download"], [class*="Download"] { display: none !important; }'
      ].join('\n');

      function fixElements(root) {
        if (!root) return;
        var els = root.querySelectorAll('*');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (!el.style) continue;
          var bg = el.style.backgroundColor;
          if (bg === 'rgb(255, 255, 255)' || bg === 'rgb(249, 250, 251)' || bg === 'rgb(241, 245, 249)' || bg === 'white') {
            el.style.setProperty('background-color', BG, 'important');
          }
          var c = el.style.color;
          if (c === 'rgb(51, 51, 51)' || c === 'rgb(0, 0, 0)' || c === '#333' || c === '#000' || c === 'rgb(17, 24, 39)') {
            el.style.setProperty('color', TXT, 'important');
          }
        }
      }

      function inject(root) {
        if (!root) return false;
        if (root.shadowRoot && !root.shadowRoot.getElementById('kpm-dark')) {
          var s = document.createElement('style');
          s.id = 'kpm-dark';
          s.textContent = OVERRIDES;
          root.shadowRoot.appendChild(s);
        }
        if (!document.getElementById('kpm-dark-global')) {
          var g = document.createElement('style');
          g.id = 'kpm-dark-global';
          g.textContent = OVERRIDES;
          document.head.appendChild(g);
        }
        fixElements(root);
        if (root.shadowRoot) fixElements(root.shadowRoot);
        return true;
      }

      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        var rc = document.getElementById('redoc-container') || document.querySelector('redoc');
        if (rc) {
          inject(rc);
          if (rc.shadowRoot && rc.shadowRoot.querySelector('section')) {
            clearInterval(iv);
            fixElements(rc);
            if (rc.shadowRoot) fixElements(rc.shadowRoot);
            new MutationObserver(function () {
              inject(rc);
              fixElements(rc);
              if (rc.shadowRoot) fixElements(rc.shadowRoot);
            }).observe(rc, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
          }
        }
        if (tries > 50) { clearInterval(iv); if (rc) { inject(rc); fixElements(rc); } }
      }, 200);
    })();
  </script>
  <script>
    (function () {
      var loader = document.getElementById('kpmLoader');
      if (loader) {
        window.addEventListener('load', function () {
          setTimeout(function () { loader.classList.add('kpm-loaded'); }, 150);
        });
        setTimeout(function () { loader.classList.add('kpm-loaded'); }, 5000);
      }
      var topbar = document.getElementById('kpmTopbar');
      window.addEventListener('scroll', function () {
        topbar.classList.toggle('kpm-scrolled', window.scrollY > 10);
      }, { passive: true });

      var hamburger = document.getElementById('kpmHamburger');
      var drawer = document.getElementById('kpmDrawer');
      var overlay = document.getElementById('kpmOverlay');
      var closeBtn = document.getElementById('kpmDrawerClose');
      function openDrawer() { drawer.classList.add('kpm-open'); overlay.classList.add('kpm-open'); document.body.style.overflow = 'hidden'; }
      function closeDrawer() { drawer.classList.remove('kpm-open'); overlay.classList.remove('kpm-open'); document.body.style.overflow = ''; }
      hamburger.addEventListener('click', function () { drawer.classList.contains('kpm-open') ? closeDrawer() : openDrawer(); });
      overlay.addEventListener('click', closeDrawer);
      closeBtn.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawer.classList.contains('kpm-open')) closeDrawer(); });
      window.addEventListener('resize', function () { if (window.innerWidth > 900 && drawer.classList.contains('kpm-open')) closeDrawer(); });
    })();
  </script>
</body>
</html>
